services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - fileName: ./backend/.env
    depends_on:
      - postgres
    
  postgres:
  image: postgres:16
  environment:
    POSTGRES_DB: ai_job_copilot
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"